name: Build UZAKDUR APK

on:
  push:
    branches: [ main, 'claude/**' ]
    # Sadece admin paneli (docs/, GitHub Pages) değişince APK'yı yeniden
    # derleyip "yeni sürüm var" bildirimi tetiklemeyelim — telefondaki
    # uygulama kodu bu değişikliklerden etkilenmiyor.
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub Actions, "if:" koşullarında secrets context'ine doğrudan erişime
    # izin vermiyor (bkz. "Unrecognized named-value: 'secrets'" hatası) — bu
    # yüzden önce job seviyesinde normal bir env değişkenine aktarıp asıl
    # if koşulunda o değişkeni kontrol ediyoruz.
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.UZAKDUR_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - run: flutter pub get
      # Kalıcı release imzası: secret yoksa (ör. bir fork'ta) bu adım atlanır
      # ve build.gradle debug imzasına düşer — ama main/claude/** dallarında
      # bu secret'lar tanımlıysa APK her zaman aynı anahtarla imzalanır, bu
      # sayede kullanıcılar üzerine "güncelleme" olarak kurabilir.
      - name: Release keystore'u decode et
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          UZAKDUR_KEYSTORE_BASE64: ${{ secrets.UZAKDUR_KEYSTORE_BASE64 }}
        run: echo "$UZAKDUR_KEYSTORE_BASE64" | base64 -d > android/app/uzakdur-release.jks
      # --flavor phone: android/app/build.gradle'a saat (Wear OS) sürümü için
      # ayrı bir "wear" flavor'ı eklendi (bkz. android/README_WEAR.md) —
      # flavor tanımlanınca Gradle artık flavor'sız "assembleRelease" task'ını
      # üretmiyor, açıkça belirtilmesi gerekiyor. Çıktı dosya adı da bu
      # yüzden "app-release.apk" değil "app-phone-release.apk" oldu.
      - run: flutter build apk --release --flavor phone -t lib/main.dart --dart-define=APP_BUILD_NUMBER=${{ github.run_number }}
        env:
          UZAKDUR_KEYSTORE_PASSWORD: ${{ secrets.UZAKDUR_KEYSTORE_PASSWORD }}
          UZAKDUR_KEY_ALIAS: ${{ secrets.UZAKDUR_KEY_ALIAS }}
          UZAKDUR_KEY_PASSWORD: ${{ secrets.UZAKDUR_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: uzakdur-apk
          path: build/app/outputs/flutter-apk/app-phone-release.apk
          retention-days: 30
      # Wear OS (saat) APK'sı — henüz gerçek bir saatte hiç denenmedi, bu
      # yüzden burada başarısız olsa bile (continue-on-error) asıl telefon
      # yayınını ASLA engellememeli.
      - name: Wear (saat) APK'sını derle
        id: wear_build
        continue-on-error: true
        run: flutter build apk --release --flavor wear -t lib/main_wear.dart --dart-define=APP_BUILD_NUMBER=${{ github.run_number }}
        env:
          UZAKDUR_KEYSTORE_PASSWORD: ${{ secrets.UZAKDUR_KEYSTORE_PASSWORD }}
          UZAKDUR_KEY_ALIAS: ${{ secrets.UZAKDUR_KEY_ALIAS }}
          UZAKDUR_KEY_PASSWORD: ${{ secrets.UZAKDUR_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: steps.wear_build.outcome == 'success'
        with:
          name: uzakdur-wear-apk
          path: build/app/outputs/flutter-apk/app-wear-release.apk
          retention-days: 30
          if-no-files-found: ignore
      # main'e her push'ta, sabit ve süresi dolmayan bir indirme linki (Actions
      # artifact'larının aksine 30 günde silinmiyor, kimlik doğrulama
      # gerektirmiyor) için bir GitHub Release oluşturulup APK'lara eklenir.
      # Uygulama da açılışta bunu kontrol edip güncelleme olduğunda haber verir.
      - name: Yayın dosyalarını hazırla
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-phone-release.apk release-assets/
          if [ -f build/app/outputs/flutter-apk/app-wear-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-wear-release.apk release-assets/
          fi
      - name: Yayın oluştur (main için)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: UZAKDUR build ${{ github.run_number }}
          make_latest: true
          files: release-assets/*
